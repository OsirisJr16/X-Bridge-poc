[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-bridge-poc"
version = "0.1.0"
description = "Research proof of concept for AI-based semantic schema matching"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/x_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
